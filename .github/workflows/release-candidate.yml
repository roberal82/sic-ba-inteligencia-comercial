name: SIC-BA release candidate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "run_*.py"
      - "config/**"
      - "docs/sprints/**"
      - ".github/workflows/release-candidate.yml"
  push:
    branches:
      - "sprint/003-release-candidate"
      - "feature/f4-orchestration-dryrun"

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check openpyxl pytest xlsxwriter

      - name: Compile release candidate
        run: |
          python -m compileall -q src
          python -m py_compile run_erp_diff.py run_f4.py run_f4_sandbox.py run_sprint002_stage.py run_release_gate.py

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Evaluate technical release gate
        run: python run_release_gate.py --evidence config/release_candidate.example.json --pretty

      - name: Verify no private payloads are tracked
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -Ei '(^|/)private-data/|\.xlsx$|\.xls$|\.p12$|\.pfx$|(^|/)\.env$' || true)"
          if [ -n "$bad" ]; then
            echo "Tracked private/binary payloads detected:"
            echo "$bad"
            exit 1
          fi

      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD
