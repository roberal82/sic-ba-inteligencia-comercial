name: F4 orchestration tests

on:
  pull_request:
    paths:
      - "src/orchestration/**"
      - "tests/test_f4_orchestration.py"
      - "run_f4.py"
      - "config/f4_manifest.example.json"
      - ".github/workflows/f4-orchestration-tests.yml"
  push:
    branches:
      - "feature/f4-orchestration-dryrun"
    paths:
      - "src/orchestration/**"
      - "tests/test_f4_orchestration.py"
      - "run_f4.py"
      - "config/f4_manifest.example.json"
      - ".github/workflows/f4-orchestration-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run F4 guardrail tests
        run: python -m unittest tests/test_f4_orchestration.py

      - name: Run example dry-run
        run: python run_f4.py --manifest config/f4_manifest.example.json --mode dry-run --pretty
