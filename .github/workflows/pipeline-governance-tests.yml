name: Pipeline governance tests

on:
  pull_request:
    paths:
      - "src/cotizaciones.py"
      - "src/dashboard_cotizaciones.py"
      - "src/pipeline_governance.py"
      - "tests/test_pipeline_governance.py"
      - ".github/workflows/pipeline-governance-tests.yml"
  push:
    branches:
      - "fix/pipeline-governance-no-inferred-forecast"

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependency
        run: python -m pip install pandas
      - name: Run pipeline governance tests
        run: python -m unittest tests/test_pipeline_governance.py
